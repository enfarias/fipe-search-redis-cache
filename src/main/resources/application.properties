# ===================================================================
# CONFIGURAÇÕES GERAIS DA APLICAÇÃO
# ===================================================================
# Nome da aplicação exibido nos logs e no ecossistema Spring
spring.application.name=fipe-search


# ===================================================================
# CONEXÃO COM O BANCO DE DADOS RELACIONAL (PostgreSQL)
# ===================================================================
# URL de conexão JDBC apontando para o container Docker local na porta padrão 5432
spring.datasource.url=jdbc:postgresql://localhost:5433/fipesearch
spring.datasource.username=postgres
spring.datasource.password=postgres


# ===================================================================
# CONFIGURAÇÕES DO HIBERNATE / SPRING DATA JPA
# ===================================================================
# 'create-drop': Recria o esquema do banco de dados ao iniciar e o apaga ao encerrar a aplicação
spring.jpa.hibernate.ddl-auto=create-drop

# Adia a inicialização do datasource para permitir que scripts de carga rodem no momento correto
spring.jpa.defer-datasource-initialization=true


# ===================================================================
# INICIALIZAÇÃO DE SCRIPTS SQL (Ex: data.sql / schema.sql)
# ===================================================================
# 'always': Força a execução dos scripts de inicialização SQL sempre que a aplicação subir
spring.sql.init.mode=always


# ===================================================================
# CONFIGURAÇÕES DO CACHE / REDIS
# ===================================================================
# Endereço e porta do servidor Redis rodando localmente via Docker
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Propriedades customizadas da aplicação para controle do cache e tempo de vida (TTL)
app.cache.name=fipe
app.cache.ttl-hours=24


# ===================================================================
# CONFIGURAÇÃO DE LOGS
# ===================================================================
# Ativa o nível de log DEBUG para todo o pacote da aplicação, facilitando o rastreio
logging.level.com.treinamento.fipe_search=DEBUG